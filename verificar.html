<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificación de datos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23000'/%3E%3Cpath d='M6 12.5l4 4 8-9' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --bg: #f3f3f3; --surface: #fff; --border: #e0e0e0; --ink: #0a0a0a; --ink-2: #474747; --ink-3: #6e6e6e; --ok: #1b7f3b; --warn: #a15c00; --err: #b3261e; --head: #0a0a0a; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #000; --surface: #111; --border: #2b2b2b; --ink: #f5f5f5; --ink-2: #c2c2c2; --ink-3: #8f8f8f; --ok: #4ade80; --warn: #fbbf24; --err: #ff7a74; --head: #1d1d1d; } }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #000; --surface: #111; --border: #2b2b2b; --ink: #f5f5f5; --ink-2: #c2c2c2; --ink-3: #8f8f8f; --ok: #4ade80; --warn: #fbbf24; --err: #ff7a74; --head: #1d1d1d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Inter", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    header { background: #000; color: #fff; padding: 18px 24px; }
    header .in, main { max-width: 1400px; margin: 0 auto; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: rgba(255,255,255,.75); }
    header a { color: #fff; }
    main { padding: 18px 24px 40px; }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 150px; }
    .chip b { display: block; font-size: 22px; }
    .chip small { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    section h2 { margin: 0; padding: 10px 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--head); color: #fff; }
    section .note { padding: 10px 14px; color: var(--ink-2); font-size: 13px; border-bottom: 1px solid var(--border); }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    td.n { text-align: right; white-space: nowrap; }
    td.d { white-space: nowrap; }
    .ok { color: var(--ok); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    .err, .late { color: var(--err); font-weight: 700; }
    .muted { color: var(--ink-3); }
    code { font-size: 11.5px; background: rgba(127,127,127,.12); padding: 1px 4px; border-radius: 4px; }
    ul { margin: 0; padding: 10px 14px 12px 32px; }
    li { margin: 2px 0; }
    @media (max-width: 760px) { header, main { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header><div class="in">
    <h1>Verificación de datos · Monday → Dashboard</h1>
    <p id="sub">Compara lo que dice Monday con lo que muestra el dashboard. <a href="index.html">Volver al dashboard</a></p>
  </div></header>
  <main id="app"><p class="muted">Cargando…</p></main>

  <script src="monday.js"></script>
  <script>
  // Verificación independiente: vuelve a leer el crudo de Monday (monday/crudo/kelly.json) con su propio código
  // y lo compara con monday.js, que es lo que usa el dashboard.
  (async function () {
    const app = document.getElementById("app");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const DAY = 864e5, days = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / DAY);
    const rango = (t) => { const m = t && String(t).match(/^\s*(\d{4}-\d{2}-\d{2})\s*-\s*(\d{4}-\d{2}-\d{2})\s*$/); return m ? [m[1], m[2]] : null; };
    const num = (t) => (t == null || t === "" || t === "null" || isNaN(Number(String(t).replace(/,/g, ""))) ? null : Number(String(t).replace(/,/g, "")));
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const fr = (r) => (r ? (r[0] === r[1] ? r[0] : r[0] + " → " + r[1]) : "—");
    const m$ = (v) => "US$ " + Math.round(v || 0).toLocaleString("en-US");
    const MD = window.DIQUE_MONDAY;
    let raw;
    try {
      const r = await fetch("monday/crudo/kelly.json", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      raw = await r.json();
    } catch (e) {
      app.innerHTML = `<p class="err">No se pudo leer monday/crudo/kelly.json (${esc(e.message)}). Abre esta página desde el servidor o desde GitHub Pages.</p>`;
      return;
    }
    if (!MD || !MD.areas) { app.innerHTML = '<p class="err">Falta monday.js o está en un formato anterior.</p>'; return; }

    // Lectura del crudo: valor de cada columna tal como lo muestra Monday
    const board = (id) => raw.boards.find((b) => b.id === id);
    const val = (it, cid) => { const c = it.column_values.find((x) => x.id === cid); if (!c) return undefined; return c.type === "mirror" || c.type === "formula" ? c.display_value : c.type === "board_relation" ? c.linked_item_ids || [] : c.text; };

    let nOk = 0, nWarn = 0, nErr = 0;
    const mark = (lvl, txt) => { if (lvl === "ok") nOk++; else if (lvl === "warn") nWarn++; else nErr++; return `<div class="${lvl === "ok" ? "ok" : lvl === "warn" ? "warn" : "err"}">${lvl === "ok" ? "✓" : lvl === "warn" ? "⚠" : "✗"} ${txt}</div>`; };
    const resumen = (cs) => { const bad = cs.filter((c) => !c.includes('class="ok"')); return (bad.length < cs.length && !bad.some((c) => c.includes('class="err"')) ? `<div class="ok">✓ ${cs.length - bad.length} de ${cs.length} coinciden</div>` : "") + bad.join(""); };
    const eq = (a, b) => Math.abs((a || 0) - (b || 0)) < 0.5;

    // 1. Cronograma
    const CB = board("18431008651");
    const C = { estado: "color_mm6v6vf2", duracion: "numeric_mm6zgcqw", real: "timerange_mm78kjs", base: "timerange_mm7yfj5p", dif: "formula_mm7ygv4s" };
    const cronoRows = CB.items_page.items.map((it) => {
      const d = MD.cronograma.find((x) => x.id === it.id) || {};
      const nombre = it.name.replace(/\s+/g, " ").trim();
      const realM = rango(val(it, C.real)), baseM = rango(val(it, C.base)), difM = num(val(it, C.dif)), durM = num(val(it, C.duracion));
      const ck = [];
      ck.push(d.id ? mark("ok", "está en el dashboard") : mark("err", "no está en el dashboard"));
      ck.push(same(d.real || null, realM) ? mark("ok", "Fecha Real igual") : mark("err", "Fecha Real distinta"));
      ck.push(same(d.base || null, baseM) ? mark("ok", "Línea Base igual") : mark("err", "Línea Base distinta"));
      ck.push((d.estado || "") === (val(it, C.estado) || "") ? mark("ok", "Estado igual") : mark("err", "Estado distinto"));
      let calc = null;
      if (realM && baseM) { calc = days(baseM[1], realM[1]); ck.push(difM === calc ? mark("ok", "Diferencia coincide") : mark("err", `Diferencia: Monday ${difM}, recalculada ${calc}`)); }
      if (realM && durM > 0 && Math.abs(days(realM[0], realM[1]) + 1 - durM) > 1) ck.push(mark("warn", `Duración ${durM} d, la Fecha Real cubre ${days(realM[0], realM[1]) + 1} d`));
      if (!realM) ck.push(mark("warn", "sin fechas en Monday: no se dibuja"));
      const atr = difM > 0 ? `<span class="late">+${difM} d</span>` : difM == null ? "—" : difM + " d";
      return `<tr><td><b>${esc(nombre)}</b><div class="muted">${esc(it.group.title)} · ${esc(val(it, C.estado) || "")}${durM === 0 ? " · hito" : ""}</div></td>
        <td class="d">${esc(val(it, C.real) || "—")}<div class="muted">${fr(d.real)}</div></td><td class="d">${esc(val(it, C.base) || "—")}<div class="muted">${fr(d.base)}</div></td>
        <td class="n">${atr}<div class="muted">${calc == null ? "—" : "calc. " + calc}</div></td><td>${resumen(ck)}</td></tr>`;
    }).join("");

    // 2 y 3. Trabajos de P1, P2 y P3: avance y costos, recalculados desde el crudo
    const P = {
      ingenieria: { id: "18431019817", e: "color_mm7yb2cs", d: "numeric_mm7yw5hx", pr: "numeric_mm7y9v4k", po: "lookup_mm7yk7y7", inc: "lookup_mm7yh3hm" },
      cubierta: { id: "18432105237", e: "color_mm7y4j97", d: "numeric_mm7y9sbv", pr: "numeric_mm7yw4b3", po: "lookup_mm7y2awx", inc: "lookup_mm7ybkjg" },
      tecnico: { id: "18432105438", e: "color_mm7vv5nh", d: "numeric_mm7v7xt9", pr: "numeric_mm7y6h6f", po: "lookup_mm7ywkfv", inc: "lookup_mm7ym614" }
    };
    const PCT = { "0%": 0, "25%": 25, "50%": 50, "75%": 75, "100%": 100 };
    const lineas = new Map(); // id -> costos leídos del crudo (para comprobar los centros de costo)
    const tot = { n: 0, conD: 0, dur: 0, avd: 0, sol: 0, apr: 0, pro: 0, po: 0, inc: 0 };
    const avRows = [], costRows = [];
    Object.entries(P).forEach(([k, c]) => {
      const b = board(c.id), a = MD.areas.find((x) => x.id === k) || { trabajos: [] };
      const r = { n: 0, conD: 0, dur: 0, avd: 0, sol: 0, apr: 0, pro: 0, po: 0, inc: 0 }, est = {};
      b.items_page.items.forEach((it) => {
        const e = val(it, c.e) || "";
        est[e || "(vacío)"] = (est[e || "(vacío)"] || 0) + 1;
        const L = { sol: num(val(it, "numeric_mm6vjdrd")) || 0, rev: num(val(it, "numeric_mm78kpas")) || 0, apr: num(val(it, "numeric_mm78s0hd")) || 0, pro: num(val(it, c.pr)) || 0, po: num(val(it, c.po)) || 0, inc: num(val(it, c.inc)) || 0 };
        lineas.set(it.id, L);
        if (e === "Cancelado") return;
        r.n++;
        const d = num(val(it, c.d));
        if (d > 0) { r.conD++; r.dur += d; r.avd += (d * (PCT[e] || 0)) / 100; }
        r.sol += L.sol; r.apr += L.apr; r.pro += L.pro; r.po += L.po; r.inc += L.inc;
      });
      Object.keys(tot).forEach((x) => (tot[x] += r[x]));
      const act = a.trabajos.filter((t) => !t.cancelado), s = (f) => act.reduce((x, t) => x + (t[f] || 0), 0);
      const dCon = act.filter((t) => t.duracion > 0), dDur = dCon.reduce((x, t) => x + t.duracion, 0);
      const pc = r.dur ? (r.avd / r.dur) * 100 : 0, pm = dDur ? (dCon.reduce((x, t) => x + t.duracion * t.pct, 0) / dDur) : 0;
      avRows.push(`<tr><td><b>${esc(b.name)}</b><div class="muted">${Object.entries(est).map(([e, n]) => esc(e) + ": " + n).join(" · ")}</div></td>
        <td class="n">${r.n}</td><td class="n">${r.conD}</td><td class="n">${r.dur}</td><td class="n"><b>${pc.toFixed(1)}%</b></td><td class="n">${pm.toFixed(1)}%</td>
        <td>${resumen([r.n === act.length ? mark("ok", "trabajos") : mark("err", `trabajos: ${r.n} en Monday, ${act.length} en el dashboard`), Math.abs(pc - pm) < 0.05 ? mark("ok", "avance") : mark("err", "avance distinto")].concat(r.n && !r.conD ? [mark("warn", "ningún trabajo tiene Duración: el avance se muestra 0 %")] : []))}</td></tr>`);
      const cmp = [["sol", "solicitado"], ["apr", "aprobado"], ["pro", "proyectado"], ["po", "po"], ["inc", "incurrido"]].map(([x, f]) => (eq(r[x], s(f)) ? mark("ok", f) : mark("err", `${f}: Monday ${m$(r[x])}, dashboard ${m$(s(f))}`)));
      costRows.push(`<tr><td><b>${esc(b.name)}</b></td><td class="n">${m$(r.sol)}</td><td class="n">${m$(r.apr)}</td><td class="n">${m$(r.pro)}</td><td class="n">${m$(r.po)}</td><td class="n">${m$(r.inc)}</td><td>${resumen(cmp)}</td></tr>`);
    });

    // 4. Centros de costo: el tablero CC contra el dashboard y contra la suma de sus líneas
    const CCB = board("18431746322");
    const F = { rev: "formula_mm7d91f2", apr: "formula_mm7dehmt", po: "formula_mm7yshcc", inc: "formula_mm7yyr9q", pro: "formula_mm7ydqr4", lin: "board_relation_mm7a4ck0" };
    const ccTot = { apr: 0, pro: 0, po: 0, inc: 0 };
    const ccRows = CCB.items_page.items.map((it) => {
      const d = MD.centros.find((x) => x.id === it.id) || {};
      const v = { rev: num(val(it, F.rev)) || 0, apr: num(val(it, F.apr)) || 0, po: num(val(it, F.po)) || 0, inc: num(val(it, F.inc)) || 0, pro: num(val(it, F.pro)) || 0 };
      Object.keys(ccTot).forEach((x) => (ccTot[x] += v[x]));
      const ids = val(it, F.lin) || [];
      const sl = (x) => ids.reduce((a, id) => a + ((lineas.get(id) || {})[x] || 0), 0);
      const ck = [
        eq(v.apr, d.aprobado) && eq(v.pro, d.proyectado) && eq(v.po, d.po) && eq(v.inc, d.incurrido) ? mark("ok", "montos iguales en el dashboard") : mark("err", "montos distintos en el dashboard"),
        eq(v.apr, sl("apr")) ? mark("ok", "aprobado = Σ líneas") : mark("err", `aprobado ${m$(v.apr)} ≠ Σ líneas ${m$(sl("apr"))}`),
        eq(v.rev, sl("rev")) ? mark("ok", "revisado = Σ líneas") : mark("err", `revisado ${m$(v.rev)} ≠ Σ líneas ${m$(sl("rev"))}`),
        eq(v.pro, sl("pro")) ? mark("ok", "proyectado = Σ líneas") : mark("err", `proyectado ${m$(v.pro)} ≠ Σ líneas ${m$(sl("pro"))}`)
      ];
      const sinLinea = ids.filter((id) => !lineas.has(id)).length;
      if (sinLinea) ck.push(mark("warn", `${sinLinea} línea(s) conectada(s) fuera de P1, P2 y P3`));
      return `<tr><td><b>${esc(it.name)}</b><div class="muted">Grupo ${esc(it.group.title)} · ${ids.length} línea(s)</div></td><td class="n">${m$(v.apr)}</td><td class="n">${m$(v.pro)}</td><td class="n">${m$(v.po)}</td><td class="n">${m$(v.inc)}</td><td>${resumen(ck)}</td></tr>`;
    }).join("");
    const dashTot = ["aprobado", "proyectado", "po", "incurrido"].map((f) => MD.centros.reduce((a, c) => a + (c[f] || 0), 0));

    // 5. Lo que no tiene datos en Monday (no son errores de lectura)
    const sinCC = MD.areas.flatMap((a) => a.trabajos.filter((t) => !t.cancelado && !t.cc.length).map((t) => `${esc(t.nombre)} <span class="muted">(${esc(a.nombre)})</span>`));
    const pend = MD.areas.flatMap((a) => a.trabajos).filter((t) => !t.cancelado && t.solicitado && !t.aprobado);
    const nPos = board("18431381932").items_page.items.length, nCam = board("18431380804").items_page.items.length;
    // Se calcula antes de armar la página para que los contadores incluyan estos avisos
    const falta = [
      pend.length ? mark("warn", `${pend.length} trabajo(s) con monto solicitado sin aprobar: ${m$(pend.reduce((a, t) => a + t.solicitado, 0))}`) : mark("ok", "sin montos pendientes de aprobación"),
      sinCC.length ? mark("warn", `${sinCC.length} trabajo(s) sin Centro de Costo: ${sinCC.join(", ")}`) : mark("ok", "todos los trabajos tienen Centro de Costo"),
      nPos ? mark("ok", `${nPos} órdenes de compra`) : mark("warn", "el tablero POs no tiene órdenes de compra: PO e Incurrido quedan en 0"),
      nCam ? mark("ok", `${nCam} cambios o imprevistos`) : '<span class="muted">El tablero Cambios/Imprevistos no tiene registros.</span>'
    ];
    const totOk = eq(ccTot.apr, dashTot[0]) && eq(ccTot.pro, dashTot[1]) && eq(ccTot.po, dashTot[2]) && eq(ccTot.inc, dashTot[3]) ? mark("ok", "totales iguales") : mark("err", "totales distintos");

    app.innerHTML = `
      <div class="chips">
        <div class="chip"><small>Coincidencias</small><b class="ok">${nOk}</b></div>
        <div class="chip"><small>Avisos</small><b class="warn">${nWarn}</b></div>
        <div class="chip"><small>Errores</small><b class="${nErr ? "err" : "ok"}">${nErr}</b></div>
        <div class="chip"><small>Trabajos P1 + P2 + P3</small><b>${tot.n}</b></div>
        <div class="chip"><small>Centros de costo</small><b>${CCB.items_page.items.length}</b></div>
        <div class="chip"><small>POs · Cambios</small><b>${nPos} · ${nCam}</b></div>
      </div>
      <section><h2>1 · Tablero Cronograma</h2>
        <div class="note">Arriba de cada celda está el texto tal como viene de Monday; debajo, lo que usa el dashboard. El atraso es la columna <b>Diferencia</b>, que aquí se recalcula como fin real − fin base.</div>
        <div class="scroll"><table><thead><tr><th>Elemento</th><th>Fecha Real</th><th>Línea Base</th><th>Diferencia</th><th>Revisión</th></tr></thead><tbody>${cronoRows}</tbody></table></div></section>
      <section><h2>2 · Avance físico (P1, P2 y P3)</h2>
        <div class="note">Avance = Σ (Estado % × Duración) / Σ Duración, igual que la columna "Avance" de Monday. Total recalculado: <b>${(tot.dur ? (tot.avd / tot.dur) * 100 : 0).toFixed(1)}%</b> con ${tot.conD} de ${tot.n} trabajos con duración.</div>
        <div class="scroll"><table><thead><tr><th>Tablero</th><th>Trabajos</th><th>Con duración</th><th>Σ duración</th><th>Avance recalculado</th><th>En el dashboard</th><th>Revisión</th></tr></thead><tbody>${avRows.join("")}</tbody></table></div></section>
      <section><h2>3 · Costos por área</h2>
        <div class="note">Suma de las columnas de cada trabajo: $ Solicitado, $ Aprobado Dirección, $ Proyectado, $PO Total e $Incurrido (las dos últimas vienen de las POs enlazadas).</div>
        <div class="scroll"><table><thead><tr><th>Tablero</th><th>Solicitado</th><th>Aprobado</th><th>Proyectado</th><th>PO</th><th>Incurrido</th><th>Revisión</th></tr></thead><tbody>${costRows.join("")}</tbody></table></div></section>
      <section><h2>4 · Centros de costo</h2>
        <div class="note">Los totales del resumen gerencial salen de este tablero. Cada centro debe sumar sus líneas conectadas de P1, P2 y P3. Total en Monday: aprobado ${m$(ccTot.apr)} · proyectado ${m$(ccTot.pro)} · PO ${m$(ccTot.po)} · incurrido ${m$(ccTot.inc)}. En el dashboard: ${dashTot.map(m$).join(" · ")} ${totOk}</div>
        <div class="scroll"><table><thead><tr><th>Centro de costo</th><th>Aprobado</th><th>Proyectado</th><th>PO</th><th>Incurrido</th><th>Revisión</th></tr></thead><tbody>${ccRows}</tbody></table></div></section>
      <section><h2>5 · Datos que faltan en Monday</h2>
        <ul>${falta.map((x) => `<li>${x}</li>`).join("")}</ul></section>
      <section><h2>Cómo se actualiza</h2>
        <ul>
          <li>La lectura de Monday queda guardada tal cual en <code>monday/crudo/kelly.json</code> (leída el ${esc(raw.extraido || "—")}).</li>
          <li><code>python monday/generar.py</code> la convierte en <code>monday.js</code> y revisa que sea coherente.</li>
          <li>Esta página vuelve a leer el crudo con su propio cálculo y lo compara con el dashboard.</li>
        </ul></section>`;
    document.getElementById("sub").innerHTML = `Lectura de Monday: <b>${esc(raw.extraido || MD.extraido)}</b> · espacio GESTIÓN DE DIQUES / KELLY TRADER · 7 tableros. <a href="index.html">Volver al dashboard</a>`;
  })();
  </script>
</body>
</html>
